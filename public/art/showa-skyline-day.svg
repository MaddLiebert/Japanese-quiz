<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" preserveAspectRatio="none">
  <!-- Latar hero Shōwa 昭和 — skyline 団地 beton (kota pasca-perang).
       Seamless horizontally (gedung tepi A & G sama tinggi = 150).
       Lapis jauh (pucat) + lapis dekat (lebih gelap) → kedalaman.
       Dipakai .home-hero-bg, repeat-x, align bottom. Siang: siluet abu. -->
  <defs>
    <pattern id="winFar" width="15" height="19" patternUnits="userSpaceOnUse">
      <rect x="4" y="3.5" width="8" height="11" rx="0.5" fill="#f3f0e8" opacity="0.35"/>
    </pattern>
    <pattern id="winNear" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="3.5" y="3" width="7.5" height="11" rx="0.5" fill="#f3f0e8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- ── LAPIS JAUH (pucat, tinggi) — 団地 blok di cakrawala ── -->
  <g fill="#8c8c85" opacity="0.16">
    <rect x="0"   y="40" width="46" height="160"/>
    <rect x="52"  y="72" width="40" height="128"/>
    <rect x="98"  y="20" width="52" height="180"/>
    <rect x="156" y="58" width="44" height="142"/>
    <rect x="206" y="34" width="48" height="166"/>
    <rect x="260" y="66" width="42" height="134"/>
    <rect x="308" y="26" width="50" height="174"/>
    <rect x="364" y="40" width="36" height="160"/>
  </g>

  <!-- ── LAPIS DEKAT (lebih gelap, sedikit lebih rendah) ── -->
  <g fill="#8c8c85" opacity="0.34">
    <rect x="0"   y="86" width="58" height="114"/>
    <rect x="58"  y="120" width="48" height="80"/>
    <rect x="106" y="62" width="70" height="138"/>
    <rect x="176" y="104" width="52" height="96"/>
    <rect x="228" y="70" width="60" height="130"/>
    <rect x="288" y="110" width="50" height="90"/>
    <rect x="338" y="86" width="62" height="114"/>
  </g>

  <!-- Jendela lapis dekat -->
  <g fill="url(#winNear)">
    <rect x="0"   y="86" width="58" height="114"/>
    <rect x="58"  y="120" width="48" height="80"/>
    <rect x="106" y="62" width="70" height="138"/>
    <rect x="176" y="104" width="52" height="96"/>
    <rect x="228" y="70" width="60" height="130"/>
    <rect x="288" y="110" width="50" height="90"/>
    <rect x="338" y="86" width="62" height="114"/>
  </g>

  <!-- Garis atap tegas (beton) -->
  <g stroke="#6f6f68" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="86" x2="58" y2="86"/>
    <line x1="58" y1="120" x2="106" y2="120"/>
    <line x1="106" y1="62" x2="176" y2="62"/>
    <line x1="176" y1="104" x2="228" y2="104"/>
    <line x1="228" y1="70" x2="288" y2="70"/>
    <line x1="288" y1="110" x2="338" y2="110"/>
    <line x1="338" y1="86" x2="400" y2="86"/>
  </g>
</svg>
